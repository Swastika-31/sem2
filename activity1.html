<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>activity 1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0d0908;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .back-link {
      position: fixed;
      top: 0.9rem;
      left: 0.9rem;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 236, 212, 0.25);
      background: rgba(18, 11, 8, 0.66);
      color: #fff5ea;
      text-decoration: none;
      text-transform: lowercase;
      letter-spacing: 0.08em;
      font-size: 0.82rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(240, 204, 130, 0.6);
      outline: none;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← back</a>

  <main class="hero" aria-label="Activity 1 hero image">
    <img src="a1.jpg" alt="Activity 1 hero image">
  </main>
</body>
</html>
