<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>activity7</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0908;
      color: #fff5ea;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .page {
      width: 100vw;
      height: 100vh;
    }

    .back-link {
      position: fixed;
      top: 0.85rem;
      left: 0.9rem;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 236, 212, 0.22);
      background: rgba(255, 255, 255, 0.04);
      color: #fff5ea;
      text-decoration: none;
      text-transform: lowercase;
      letter-spacing: 0.08em;
      font-size: 0.82rem;
    }

    .viewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .fallback {
      margin: 1rem;
      font-size: 0.95rem;
      color: rgba(255, 245, 234, 0.85);
    }

      color: #f0cc82;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">← back</a>

    <object class="viewer" data="Activity%207.pdf" type="application/pdf" aria-label="Activity 7 PDF">
      <iframe class="viewer" src="Activity%207.pdf" title="Activity 7 PDF"></iframe>
      <p class="fallback">Your browser cannot display this PDF inline. <a href="Activity%207.pdf" target="_blank" rel="noopener noreferrer">Open Activity 7 PDF</a>.</p>

  </main>
